schema_version: 1
extends: base.yaml
experiment_id: main_v1
datasets:
  - 20ng
  - reuters8
  - amazon_cells
  - farm_ads
  - pang_lee
  - sentence
  - yelp_review_full
  - yelp_review_polarity
  - amazon_review_full
  - amazon_review_polarity
  - dbpedia
  - wos5736
  - ag_news
  - imdb
models:
  - random_wa
  - fasttext_wa
  - random_cnn
  - fasttext_cnn
  - random_lstm
  - fasttext_lstm
  - random_lstm_attention
  - fasttext_lstm_attention
  - random_lstm_cnn
  - fasttext_lstm_cnn
  - bert_base
  - bert_wa
  - bert_cnn
  - bert_lstm
  - bert_lstm_attention
  - bert_lstm_cnn
  - gcn
feature_selection:
  selectors: [none, df, ig, dfs]
  primary_feature_count: 1000
  sensitivity_feature_counts: [500, 1000, 1500, 2000]
random_seeds: [42, 123, 2026]
statistics:
  paired_unit: outer_fold
  confidence_level: 0.95
  tests: [wilcoxon_signed_rank]
  multiple_comparison_correction: holm
output:
  directory: main_experiments/main_v1
