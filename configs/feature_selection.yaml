schema_version: 1
version: v1
tokenizer:
  unicode_normalization: NFKC
  html_unescape: true
  remove_html_tags: true
  lowercase: true
  token_pattern: "unicode_words_with_internal_apostrophe"
selection:
  selectors: [df, ig, dfs]
  primary_feature_count: 1000
  sensitivity_feature_counts: [500, 1000, 1500, 2000]
  minimum_document_frequency: 1
  tie_break: token_ascending
  preserve_empty_documents: true
fit_protocol:
  development: inner_train_only
  final_evaluation: outer_train_only_after_epoch_selection
